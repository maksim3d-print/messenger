<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мессенджер | Light/Dark тема</title>
    <style>
        /* ---------- CSS-переменные (светлая тема по умолчанию) ---------- */
        :root {
            --bg-page: #f5f7fb;
            --bg-chat: #ffffff;
            --text-primary: #1e2a3a;
            --text-secondary: #5a6e7c;
            --header-bg: #ffffffcc;
            --header-border: #e2e8f0;
            --message-bg-own: #d9f0ff;
            --message-bg-other: #f1f3f5;
            --message-text: #1a2c3e;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #1e2a3a;
            --send-btn-bg: #3b82f6;
            --send-btn-hover: #2563eb;
            --scroll-thumb: #cbd5e1;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Тёмная тема */
        body.dark {
            --bg-page: #121212;
            --bg-chat: #1e1e2f;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --header-bg: #1e1e2fcc;
            --header-border: #2d2d3f;
            --message-bg-own: #2d3a5e;
            --message-bg-other: #2a2a3c;
            --message-text: #f1f5f9;
            --input-bg: #2a2a3c;
            --input-border: #3a3a4e;
            --input-text: #f1f5f9;
            --send-btn-bg: #4f7df3;
            --send-btn-hover: #6b92ff;
            --scroll-thumb: #3a3a4e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background-color: var(--bg-page);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Контейнер мессенджера */
        .messenger {
            width: 100%;
            max-width: 550px;
            height: 85vh;
            min-height: 500px;
            background-color: var(--bg-chat);
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(0px);
        }

        /* ----- ШАПКА (сверху) ----- */
        .chat-header {
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--header-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-details p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Переключатель темы — встроенный в шапку (дублируем старый, но в новой позиции) */
        .theme-toggle-inline {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch-label-small {
            display: block;
            width: 52px;
            height: 28px;
            background-color: var(--toggle-bg, #cbd5e1);
            border-radius: 40px;
            cursor: pointer;
            position: relative;
        }

        .switch-label-small::before {
            content: "";
            display: block;
            width: 22px;
            height: 22px;
            background-color: var(--toggle-knob, white);
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        .theme-switch:checked + .switch-label-small::before {
            transform: translateX(24px);
        }

        /* Скрываем оригинальный чекбокс (он будет один на всю страницу) */
        .theme-switch {
            display: none;
        }

        /* ----- ОБЛАСТЬ СООБЩЕНИЙ (скролл) ----- */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Стили сообщений */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        .message-own {
            align-self: flex-end;
            background-color: var(--message-bg-own);
            color: var(--message-text);
            border-bottom-right-radius: 4px;
        }

        .message-other {
            align-self: flex-start;
            background-color: var(--message-bg-other);
            color: var(--message-text);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: right;
        }

        /* ----- НИЖНЯЯ ПАНЕЛЬ (ввод сообщения) ----- */
        .input-area {
            background-color: var(--bg-chat);
            border-top: 1px solid var(--header-border);
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #messageInput {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 28px;
            padding: 12px 18px;
            font-size: 0.9rem;
            outline: none;
            color: var(--input-text);
            font-family: inherit;
        }

        #messageInput:focus {
            border-color: var(--send-btn-bg);
        }

        #sendBtn {
            background-color: var(--send-btn-bg);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.2rem;
        }

        #sendBtn:hover {
            background-color: var(--send-btn-hover);
            transform: scale(1.02);
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стилизация скроллбара */
        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="messenger">
    <!-- ШАПКА сверху -->
    <div class="chat-header">
        <div class="user-info">
            <div class="avatar">🤖</div>
            <div class="user-details">
                <h3>Чат-наставник</h3>
                <p>онлайн · отвечает сразу</p>
            </div>
        </div>
        <div class="theme-toggle-inline">
            <!-- Чекбокс для темы (скрыт) - используем глобально -->
            <input type="checkbox" id="globalThemeToggle" class="theme-switch">
            <label for="globalThemeToggle" class="switch-label-small"></label>
        </div>
    </div>

    <!-- ОКНО СООБЩЕНИЙ -->
    <div class="messages-area" id="messagesContainer">
        <!-- Пример стартовых сообщений -->
        <div class="message message-other">
            Привет! Это демо-чат. Тема меняется плавно 🌓
            <div class="message-time">только что</div>
        </div>
        <div class="message message-own">
            Отлично! А можно отправить своё сообщение?
            <div class="message-time">сейчас</div>
        </div>
        <div class="message message-other">
            Конечно, печатай внизу и жми на кнопку ➡️
            <div class="message-time">в ответ</div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
        <button id="sendBtn">📤</button>
    </div>
</div>

<script>
    // --- Управление темой (адаптация под ранее созданный переключатель) ---
    const themeToggle = document.getElementById('globalThemeToggle');
    const body = document.body;

    function setTheme(isDark) {
        if (isDark) {
            body.classList.add('dark');
            themeToggle.checked = true;
            localStorage.setItem('messengerTheme', 'dark');
        } else {
            body.classList.remove('dark');
            themeToggle.checked = false;
            localStorage.setItem('messengerTheme', 'light');
        }
    }

    // Загрузка сохранённой темы или системных настроек
    const savedTheme = localStorage.getItem('messengerTheme');
    if (savedTheme === 'dark') {
        setTheme(true);
    } else if (savedTheme === 'light') {
        setTheme(false);
    } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark);
    }

    themeToggle.addEventListener('change', (e) => {
        setTheme(e.target.checked);
    });

    // --- Логика мессенджера (отправка сообщений) ---
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // Функция добавления сообщения (текст, тип 'own' или 'other')
    function addMessage(text, type = 'own') {
        if (!text.trim()) return;

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type === 'own' ? 'message-own' : 'message-other'}`;

        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        messageDiv.innerHTML = `
            ${escapeHtml(text)}
            <div class="message-time">${timeString}</div>
        `;
        messagesContainer.appendChild(messageDiv);
        // Прокрутка вниз
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Простая защита от XSS (преобразование спецсимволов)
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Отправка сообщения пользователя
    function sendOwnMessage() {
        const text = messageInput.value.trim();
        if (text === "") return;

        addMessage(text, 'own');
        messageInput.value = '';

        // Имитация ответа собеседника (через 0.8 секунды)
        setTimeout(() => {
            const autoReply = getRandomReply(text);
            addMessage(autoReply, 'other');
        }, 600);
    }

    // Небольшие ответы (для оживления)
    function getRandomReply(userMsg) {
        const replies = [
            "Круто! Расскажи ещё.",
            "Понял, а что по коду?",
            "Интересно... продолжай.",
            "👍 Отличный мессенджер получается!",
            "Ты молодец, Максим!"
        ];
        if (userMsg.toLowerCase().includes('тема') || userMsg.toLowerCase().includes('тему')) {
            return "Да, тема переключается плавно, здорово!";
        }
        if (userMsg.toLowerCase().includes('спасибо')) {
            return "Всегда рад помочь! 😊";
        }
        return replies[Math.floor(Math.random() * replies.length)];
    }

    // Обработчики отправки
    sendBtn.addEventListener('click', sendOwnMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendOwnMessage();
        }
    });
</script>
</body>
</html>
